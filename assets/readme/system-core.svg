<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Scroll signal architecture</title>
<desc id="desc">Diagram showing scroll position flowing through GSAP into a mutable signal bus and then into visual layers.</desc>
