<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Avengers Doomsday — Cinematic Scroll Experience</title>
<desc id="desc">Original dark multiverse computer-interface artwork for the Avengers Doomsday fan experience repository.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050609"/>
    <stop offset=".48" stop-color="#0C1013"/>
    <stop offset="1" stop-color="#08050D"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#E9FFB3"/>
    <stop offset=".4" stop-color="#7BFF5A"/>
    <stop offset="1" stop-color="#1C7D2C"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#EEF3F6"/>
    <stop offset=".45" stop-color="#8C989F"/>
    <stop offset="1" stop-color="#2C3338"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#D9B7FF"/>
    <stop offset=".5" stop-color="#7D54B5"/>
    <stop offset="1" stop-color="#2A1640"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" stroke="#B7C0C7" stroke-opacity=".045"/>
  </pattern>
</defs>

<rect width="1600" height="560" rx="24" fill="url(#bg)"/>
<rect width="1600" height="560" rx="24" fill="url(#grid)"/>

<g opacity=".16">
