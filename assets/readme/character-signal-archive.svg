<title id="title">Character Signal Archive</title>
<desc id="desc">Uniform circular badge system for characters featured in the Avengers Doomsday fan experience. The Fantastic Four card uses its classic 4-in-circle emblem; the others use original symbols in the same visual treatment.</desc>
