<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Avengers Character Logo Archive</title>
<desc id="desc">Clean local vector emblems for Doctor Doom, Thor, Loki, Captain America, Cyclops, Shang-Chi, Fantastic Four and Avengers, designed for reliable GitHub README rendering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500"><stop stop-color="#080A0C"/><stop offset="1" stop-color="#101218"/></linearGradient>
  <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="500" rx="22" fill="url(#bg)"/>
<rect x="24" y="24" width="1152" height="452" rx="17" stroke="#46505A"/>
<text x="48" y="70" fill="#F3F5F6" font-size="30" font-family="'Arial Narrow',Impact,sans-serif" font-weight="700">CHARACTER // LOGO ARCHIVE</text>
<text x="48" y="98" fill="#808A92" font-size="16" font-family="Consolas,monospace">LOCAL VECTOR ASSETS // CONSISTENT RENDERING // NO EXTERNAL HOTLINKS</text>

