<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Character Signal Archive</title>
<desc id="desc">Original minimal iconography referencing characters featured in the Avengers Doomsday fan experience without reproducing official franchise logos.</desc>
<defs>
